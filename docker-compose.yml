services:
  postgres:
    image: postgres:17-alpine
    container_name: financy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financy
      POSTGRES_USER: financy
      POSTGRES_PASSWORD: financy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financy -d financy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financy-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://financy:financy@postgres:5432/financy?schema=public"
      JWT_SECRET: "sua_chave_secreta_super_segura"
      SERVER_PORT: 4000
      VITE_API_URL: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financy-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
